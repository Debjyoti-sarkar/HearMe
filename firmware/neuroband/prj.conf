# NeuroBand firmware — Zephyr config
# Target: Nordic nRF52840 (DK or MDBT50Q-1MV2 module)

# ---- Logging ----
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# ---- Bluetooth ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NeuroBand"
CONFIG_BT_DEVICE_APPEARANCE=833    # 0x0341 = Generic Heart Rate Sensor
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Secure Connections + bonding — mandatory per Volume III security posture.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_FIXED_PASSKEY=y          # PSK printed on strap binds the key
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# Larger MTU so the 20-byte BioFrame fits without fragmentation.
CONFIG_BT_BUF_ACL_RX_SIZE=64
CONFIG_BT_BUF_ACL_TX_SIZE=64
CONFIG_BT_L2CAP_TX_MTU=64
CONFIG_BT_GATT_CLIENT=n

# Advertise the manufacturer data containing the serial prefix.
CONFIG_BT_EXT_ADV=y

# ---- I2C for sensors ----
CONFIG_I2C=y

# ---- ADC for GSR + sEMG ----
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y

# ---- GPIO / haptics / cap-touch ----
CONFIG_GPIO=y
CONFIG_PWM=y                       # for haptic LRA driving via DRV2605L

# ---- Power management ----
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# ---- Misc ----
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
